name: Continuous Integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "Flatpak CI"
    runs-on: ubuntu-latest
    strategy:
        matrix:
          config:
            - package: DaVinci Resolve
              file: Resolve
              key: davinci-resolve
            - package: DaVinci Resolve Studio
              file: ResolveStudio
              key: davinci-resolve-studio

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
      with:
        bundle: ${{ matrix.config.key }}.flatpak
        build-debug-bundle: false
        manifest-path: com.blackmagic.${{ matrix.config.file }}.yaml
        cache-key: flatpak-builder-${{ matrix.config.key }}-${{ github.sha }}
        upload-artifact: false
        artifact-name: ${{ matrix.config.key }}.flatpak

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.key }}.flatpak
        path: ${{ matrix.config.key }}.flatpak

  # The self-contained installer/launcher tarball consumed by FlatPark as
  # extra-data (see build-bundle.sh). Built on every run so a PR that breaks the
  # bundle is caught, and attached to the release on a tag.
  bundle:
    name: "FlatPark bundle"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build the PyInstaller bundle
      run: ./build-bundle.sh

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: flatpark-bundle
        path: resolve-flatpak-*.tar.gz
        if-no-files-found: error

  # If the action was a git tag, generate a new release for the tag.
  release:
    needs: [build, bundle]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      # Download all artifacts from Stage 1 into a 'dist' directory
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: davinci*.flatpak
          merge-multiple: true

      - name: Download FlatPark bundle
        uses: actions/download-artifact@v8
        with:
          name: flatpark-bundle
          merge-multiple: true

      # Safely create the release and upload all assets at once
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            davinci*.flatpak
            resolve-flatpak-*.tar.gz
          generate_release_notes: true

  # Tell FlatPark about the release so it re-pins the bundle without a manual PR.
  # The release above is created with the default GITHUB_TOKEN, which does not
  # trigger `on: release` workflows, so this runs in the same workflow after it.
  # No token or secret is needed: FlatPark verifies the app id, repository and
  # published tag against public facts.
  #
  # This only bumps the extra-data pin and adds a <release> to the metainfo. If a
  # release also needs packaging changes (a new library staged by the wrapper or
  # apply_extra, a renamed launcher or archive layout, permissions, a new app id,
  # ...), open a PR against flatpark/flatpark as well — see "Keeping FlatPark up
  # to date" in README.md.
  flatpark:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # A FlatPark hiccup must never fail the release.
    continue-on-error: true
    strategy:
      matrix:
        app-id:
          - com.blackmagic.Resolve
          - com.blackmagic.ResolveStudio
    steps:
      - name: Notify FlatPark
        uses: flatpark/publish-action@v1
        with:
          app-id: ${{ matrix.app-id }}
          tag: ${{ github.ref_name }}
